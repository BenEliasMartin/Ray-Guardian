name: RayGuardian
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '17.2'
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.2'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '2'
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  GuardianCore:
    path: GuardianCore
  MetaWearablesDAT:
    url: https://github.com/meta/meta-wearables-dat-ios.git
    exactVersion: 1.0.1
targets:
  RayGuardian:
    type: application
    platform: iOS
    sources:
      - path: RayGuardian
        excludes:
          - Resources/ReplayMedia
          - Info.plist
          - PrivacyInfo.xcprivacy
      - path: RayGuardian/Resources/ReplayMedia
        type: folder
        buildPhase: resources
      - path: RayGuardian/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: RayGuardian/Info.plist
      properties:
        CFBundleDisplayName: Ray Guardian
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [rayguardian]
            CFBundleURLName: com.rayguardian.companion
        GuardianAPIURL: $(GUARDIAN_API_URL)
        GuardianClientToken: $(GUARDIAN_CLIENT_TOKEN)
        MWDAT:
          AppLinkURLScheme: 'rayguardian://'
          MetaAppID: $(META_APP_ID)
          ClientToken: $(META_CLIENT_TOKEN)
          TeamID: $(DEVELOPMENT_TEAM)
          Analytics:
            OptOut: true
          CrashReporting:
            OptOut: true
        NSBluetoothAlwaysUsageDescription: Connect to your glasses and optional heart-rate sensor while a demonstration is armed.
        NSMotionUsageDescription: Read glasses movement or explicitly enabled iPhone motion for Mock testing while a demonstration is armed.
        NSMicrophoneUsageDescription: Process selected microphone input locally for triggers and upload only a consented short incident window.
        NSSpeechRecognitionUsageDescription: Recognize Guardian wake and cancellation phrases on this iPhone using on-device speech recognition.
        NSCameraUsageDescription: Use the iPhone camera only when explicitly selected as a MockDeviceKit camera source.
        NSLocalNetworkUsageDescription: Connect to the Guardian demo API on your local development network.
        NSLocationWhenInUseUsageDescription: Share your current location with the demonstration operator only when incident location sharing is enabled.
        NSBonjourServices: ['_bonjour._tcp']
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedExternalAccessoryProtocols: ['com.meta.ar.wearable']
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral, external-accessory]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    preBuildScripts:
      - name: Prepare DAT registration configuration
        path: Scripts/prepare-info.sh
        inputFiles:
          - $(SRCROOT)/RayGuardian/Info.plist
          - $(SRCROOT)/Scripts/prepare-info.sh
        outputFiles:
          - $(DERIVED_FILE_DIR)/GuardianInfo.plist
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GUARDIAN_BUNDLE_ID)
        INFOPLIST_FILE: $(DERIVED_FILE_DIR)/GuardianInfo.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: GuardianCore
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATDisplay
      - package: MetaWearablesDAT
        product: MWDATInputs
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATMotion
      - package: MetaWearablesDAT
        product: MWDATSpeech
      - package: MetaWearablesDAT
        product: MWDATMockDevice
  RayGuardianUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RayGuardianUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rayguardian.companion.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: RayGuardian
schemes:
  RayGuardian:
    build:
      targets:
        RayGuardian: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [RayGuardianUITests]
    archive:
      config: Release
    profile:
      config: Release
