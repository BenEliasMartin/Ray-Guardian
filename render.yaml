services:
  - type: web
    name: ray-guardian-api
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: node --check server/index.mjs
    startCommand: npm --prefix server start
    healthCheckPath: /health
    disk:
      name: guardian-data
      mountPath: /var/data/guardian
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: "0.0.0.0"
      - key: DATA_PATH
        value: /var/data/guardian/guardian.sqlite
      - key: DEMO_CALL_TRANSPORT
        value: playback
      - key: VERDA_BASE_URL
        value: https://containers.datacrunch.io/nemotron-3-5-super-vl-b300/v1
      - key: VERDA_MODEL
        value: nemotron-3.5-super-vl
      - key: RAY_GUARDIAN_CLIENT_TOKEN
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: MEDIA_SIGNING_SECRET
        sync: false
