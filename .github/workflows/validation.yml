name: Validate Guardian
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test server/test/*.mjs
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: node scripts/bootstrap.mjs
      - run: node scripts/doctor.mjs
  swift-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios/GuardianCore
      - run: swift run --package-path ios/GuardianCore GuardianCoreChecks
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version && swift --version
      - name: Build native companion with pinned DAT SDK
        run: >-
          xcodebuild -project ios/RayGuardian.xcodeproj -scheme RayGuardian
          -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/guardian-ios CODE_SIGNING_ALLOWED=NO build
      - name: Build real-device Release configuration
        run: >-
          xcodebuild -project ios/RayGuardian.xcodeproj -scheme RayGuardian
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath /tmp/guardian-ios-release CODE_SIGNING_ALLOWED=NO build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug lintDebug
